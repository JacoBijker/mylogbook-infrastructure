services:
  marketing:
    image: docker.spoyla.com/devops-mylogbook-marketing:${MARKETING_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      mylogbook_default:
        aliases:
          - qa-mylogbook-marketing

networks:
  mylogbook_default:
    external: true
