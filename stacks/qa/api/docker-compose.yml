name: mylogbook-qa-api

services:
  api:
    image: docker.spoyla.com/devops-mylogbook-api:${API_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Sentry__Environment=qa
      - ConnectionStrings__MyLogbookDatabase=${ConnectionStrings__MyLogbookDatabase}
      - TokenOptions__Issuer=${TokenOptions__Issuer}
      - TokenOptions__Audience=${TokenOptions__Audience}
      - TokenOptions__Secret=${TokenOptions__Secret}
      - TokenOptions__AccessTokenMinutes=${TokenOptions__AccessTokenMinutes}
      - TokenOptions__RefreshTokenDays=${TokenOptions__RefreshTokenDays}
      - App__PwaUrl=${App__PwaUrl}
      - App__MarketingUrl=${App__MarketingUrl}
      - App__SupportEmail=${App__SupportEmail}
      - BlobStorageOptions__BlobStoragePath=${BlobStorageOptions__BlobStoragePath}
      - Cors__AllowedOrigins__0=${Cors__AllowedOrigins__0}
      - Cors__AllowedOrigins__1=${Cors__AllowedOrigins__1}
      - Otp__CodeLength=${Otp__CodeLength}
      - Otp__ExpiryMinutes=${Otp__ExpiryMinutes}
      - Otp__MaxAttempts=${Otp__MaxAttempts}
      - Otp__ResendCooldownSeconds=${Otp__ResendCooldownSeconds}
      - SocialAuth__GoogleClientId=${SocialAuth__GoogleClientId}
      - SocialAuth__AppleClientId=${SocialAuth__AppleClientId}
    volumes:
      - mylogbook-blobs-qa:/app/storage/blobs
    networks:
      mylogbook_default:
        aliases:
          - qa-mylogbook-api

networks:
  mylogbook_default:
    external: true

volumes:
  mylogbook-blobs-qa:
    name: mylogbook-blobs-qa
