name: mylogbook-prod-admin

services:
  admin:
    image: docker.spoyla.com/devops-mylogbook-admin:${ADMIN_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      mylogbook_default:
        aliases:
          - prod-mylogbook-admin

networks:
  mylogbook_default:
    external: true
